name: Build iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  export-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test de l'export PDF (positions, rotations, CropBox)
        run: |
          set +e
          L=/tmp/ex.log; mkdir -p /tmp/ex
          {
            pip3 install --break-system-packages -q pypdf pypdfium2 pillow
            python3 ios/Tests/export_check.py gen /tmp/ex
            swiftc -O -o /tmp/ex/check ios/XreadPDF/Editor/Model.swift ios/XreadPDF/Editor/PdfExporter.swift ios/Tests/export_check.swift
            /tmp/ex/check /tmp/ex
            python3 ios/Tests/export_check.py check /tmp/ex
            echo "STATUS=$?"
          } > $L 2>&1
          python3 .github/annotate.py EXPORT $L
          grep -q "STATUS=0" $L
