name: Build iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  export-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test de l'export PDF (positions, rotations, CropBox)
        run: |
          set +e
          L=/tmp/ex.log; mkdir -p /tmp/ex
          {
            pip3 install --break-system-packages -q pypdf pypdfium2 pillow
            python3 ios/Tests/export_check.py gen /tmp/ex
            swiftc -O -o /tmp/ex/check ios/XreadPDF/Editor/Model.swift ios/XreadPDF/Editor/PdfExporter.swift ios/Tests/main.swift
            /tmp/ex/check /tmp/ex
            python3 ios/Tests/export_check.py check /tmp/ex
            echo "STATUS=$?"
          } > $L 2>&1
          python3 .github/annotate.py EXPORT $L
          grep -q "STATUS=0" $L

  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compiler l'app iOS (IPA non signée)
        working-directory: ios
        run: |
          set +e
          brew install xcodegen >/dev/null
          xcodegen generate
          xcodebuild -project XreadPDF.xcodeproj -scheme XreadPDF -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          STATUS=$?
          grep -E "error:|warning: .*(XreadPDF/)" build.log | sort -u | head -80 > errors.log
          python3 ../.github/annotate.py BUILD errors.log
          [ $STATUS -eq 0 ] || exit 1
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/XreadPDF.app Payload/
          zip -qr XreadPDF-non-signee.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Xread-PDF-ipa
          path: ios/XreadPDF-non-signee.ipa

  simulateur:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compiler pour le simulateur et capturer les écrans
        working-directory: ios
        run: |
          set +e
          brew install xcodegen >/dev/null
          pip3 install --break-system-packages -q pypdfium2 pillow
          xcodegen generate
          xcodebuild -project XreadPDF.xcodeproj -scheme XreadPDF -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build > build-sim.log 2>&1
          STATUS=$?
          mkdir -p shots
          grep -E "error:" build-sim.log | sort -u | head -80 > shots/errors.log
          [ $STATUS -eq 0 ] && bash Tests/sim_check.sh
          echo "build=$STATUS" >> shots/sim.txt
      - name: Publier les captures sur la branche ios-captures
        working-directory: ios/shots
        run: |
          git init -q && git checkout -q -b ios-captures
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "captures ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-captures
