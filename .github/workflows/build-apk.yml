name: Build APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est préinstallé sur ubuntu-latest (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clé de signature fixe
        env:
          KEYSTORE_B64: ${{ secrets.XREADPDF_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/xreadpdf.jks"
            echo "XREADPDF_KEYSTORE_FILE=$RUNNER_TEMP/xreadpdf.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret XREADPDF_KEYSTORE absent : APK signé avec une clé aléatoire (ne s'installera pas par-dessus une version précédente)"
          fi

      - name: Compiler l'APK
        run: |
          set +e
          gradle assembleDebug --no-daemon > build.log 2>&1
          STATUS=$?
          grep -E "^e: |^w: .*xreadpdf.*(deprecated)?|error:|What went wrong|FAILURE|Could not" -A3 build.log | head -150 > errors.log
          [ -s errors.log ] && python3 ../.github/annotate.py BUILD errors.log
          exit $STATUS
        env:
          XREADPDF_KEY_PASSWORD: ${{ secrets.XREADPDF_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: Xread-PDF-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
