name: Tests Android (émulateur)

permissions:
  contents: write

on:
  push:
    branches-ignore: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-tests.yml"
  workflow_dispatch:

jobs:
  emulateur:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compiler les tests
        run: |
          set +e
          gradle assembleDebug assembleDebugAndroidTest --no-daemon > build.log 2>&1
          STATUS=$?
          grep -E "^e: |What went wrong|FAILURE" -A3 build.log | head -120 > errors.log
          [ -s errors.log ] && python3 ../.github/annotate.py BUILD errors.log
          exit $STATUS
      - name: Lancer les tests sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: gradle connectedDebugAndroidTest --no-daemon > test.log 2>&1 || (echo TESTS_FAILED >> test.log); adb logcat -d -s XreadTest:I AndroidRuntime:E TestRunner:E > logcat.log || true
      - name: Résultats
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          out = []
          for f in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              root = ET.parse(f).getroot()
              for tc in root.iter("testcase"):
                  name = tc.get("classname", "").split(".")[-1] + "." + tc.get("name", "")
                  fail = tc.find("failure")
                  out.append(("ÉCHEC " if fail is not None else "OK    ") + name)
                  if fail is not None:
                      lines = (fail.text or "").splitlines()
                      keep = [l for l in lines if "com.csa" in l or not l.strip().startswith("at ")][:25]
                      out.extend(keep)
          try:
              log = open("logcat.log", errors="replace").read().splitlines()
          except Exception:
              log = []
          steps = [l for l in log if "XreadTest" in l]
          crash = [l.split("AndroidRuntime:", 1)[-1] for l in log if "AndroidRuntime" in l and ("Exception" in l or "Error" in l or "Caused by" in l or "com.csa" in l or "FATAL" in l or "Process:" in l)][:30]
          out += ["", "--- dernières étapes ---"] + steps[-25:] + ["", "--- plantages ---"] + crash
          open("summary.log", "w").write("\n".join(out) or "aucun résultat")
          PY
          cat summary.log
          head -c 3400 summary.log > s1.log
          python3 ../.github/annotate.py RESUME s1.log || true
          # Rapport complet publié dans la branche « ci-results » (lisible sans l'interface web)
          mkdir -p /tmp/ci && cp summary.log /tmp/ci/ && cp logcat.log /tmp/ci/ 2>/dev/null || true
          tail -c 20000 test.log > /tmp/ci/test-tail.log 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results/connected /tmp/ci/xml 2>/dev/null || true
          cd /tmp/ci && git init -q && git checkout -q -b ci-results && git add -A \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Résultats $GITHUB_SHA" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results || true
          cd "$GITHUB_WORKSPACE/android"
          ! grep -q "TESTS_FAILED" test.log
