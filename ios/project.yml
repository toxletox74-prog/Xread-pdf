name: XreadPDF
options:
  bundleIdPrefix: com.csa
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
targets:
  XreadPDF:
    type: application
    platform: iOS
    sources:
      - path: XreadPDF
    settings:
      base:
        PRODUCT_NAME: XreadPDF
        PRODUCT_BUNDLE_IDENTIFIER: com.csa.xreadpdf
        INFOPLIST_FILE: XreadPDF/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
